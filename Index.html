        window.onload = function() {
            loadPlayers();
        };

        async function loadPlayers() {
            document.getElementById('loading-text').innerText = "Memuat data dari Firebase...";
            try {
                const querySnapshot = await getDocs(collection(db, "players"));
                allPlayers = [];
                querySnapshot.forEach((docSnap) => {
                    allPlayers.push({ id: docSnap.id, ...docSnap.data() });
                });

                // Jika database kosong, tampilkan tombol inject
                if (allPlayers.length === 0) {
                    document.getElementById('btn-inject').classList.remove('hidden');
                } else {
                    document.getElementById('btn-inject').classList.add('hidden');
                }

                renderTables(allPlayers);
            } catch (error) {
                console.error("Error loading data: ", error);
                document.getElementById('loading-text').innerText = "Gagal memuat data. Periksa koneksi internet / Firebase rules.";
            }
        }

        // Fungsi Tombol Inject Data Otomatis ke Firestore
        window.injectInitialData = async function() {
            if (!confirm("Yakin ingin meng-inject 46 data awal ke Firebase Firestore?")) return;
            const btn = document.getElementById('btn-inject');
            btn.innerText = "Meng-inject...";
            btn.disabled = true;

            try {
                for (let player of initialDataset) {
                    await addDoc(collection(db, "players"), player);
                }
                alert("Berhasil meng-inject 46 data pemain ke Firebase!");
                loadPlayers();
            } catch (error) {
                console.error("Error injecting data:", error);
                alert("Gagal meng-inject data.");
                btn.innerText = "🚀 Inject 46 Data Awal";
                btn.disabled = false;
            }
        };

        function renderTables(data) {
            const container = document.getElementById('table-container');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-500 text-sm py-12">Belum ada data pemain. Klik tombol <b>"Inject 46 Data Awal"</b> di atas atau tambah manual.</p>`;

                { title: "Anchor", key: "Anchor", badge: "bg-sky-950 text-sky-400 border-sky-900" },
                { title: "Flank", key: "Flank", badge: "bg-amber-950 text-amber-400 border-amber-900" },
                { title: "Pivot", key: "Pivot", badge: "bg-purple-950 text-purple-400 border-purple-900" }
            ];

            positions.forEach(pos => {
                const filtered = data.filter(p => p.position === pos.key);
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl";

                let rows = '';
                filtered.forEach((p, i) => {
                    rows += `
                        <tr onclick="openModal('${p.id}')" class="hover:bg-slate-800/70 transition cursor-pointer border-b border-slate-800/60 text-xs">
                            <td class="p-3.5 text-center text-slate-500 font-mono">${i + 1}</td>
                            <td class="p-3.5 font-bold text-slate-100">${p.name}</td>
                            <td class="p-3.5 text-slate-300 hidden sm:table-cell">${p.ttl || '-'}</td>
                            <td class="p-3.5 text-slate-300">${p.school || '-'}</td>
                            <td class="p-3.5 text-slate-400 font-mono hidden md:table-cell">${p.phone || '-'}</td>
                            <td class="p-3.5 text-center font-bold text-slate-300 hidden md:table-cell">${p.foot || 'Right'}</td>
                            <td class="p-3.5 text-slate-300 hidden lg:table-cell">${p.club || '-'}</td>
                            <td class="p-3.5 text-slate-300 hidden sm:table-cell">${p.domisili || '-'}</td>
                        </tr>
                    `;
                });

                card.innerHTML = `
                    <div class="bg-slate-950 px-5 py-3.5 border-b border-slate-800 flex justify-between items-center">
                        <span class="px-3 py-1 rounded-xl text-xs font-bold border ${pos.badge}">${pos.title}</span>
                        <span class="text-xs text-slate-400 font-mono">Total: ${filtered.length} Pemain</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead class="bg-slate-950/40 text-slate-400 uppercase font-bold text-[10px] border-b border-slate-800">
                                <tr>
                                    <th class="p-3.5 w-10 text-center">No</th>
                                    <th class="p-3.5">Nama</th>
                                    <th class="p-3.5 hidden sm:table-cell">TTL</th>
                                    <th class="p-3.5">Asal Sekolah</th>
                                    <th class="p-3.5 hidden md:table-cell">No. HP</th>
                                    <th class="p-3.5 text-center hidden md:table-cell">Foot</th>
                                    <th class="p-3.5 hidden lg:table-cell">Klub</th>
                                    <th class="p-3.5 hidden sm:table-cell">Domisili</th>
                                </tr>
                            </thead>
                            <tbody>${rows || '<tr><td colspan="8" class="p-4 text-center text-slate-500">Tidak ada pemain.</td></tr>'}</tbody>
                        </table>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.filterData = function() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allPlayers.filter(p => p.name.toLowerCase().includes(query) || p.school.toLowerCase().includes(query) || (p.domisili && p.domisili.toLowerCase().includes(query)));
            renderTables(filtered);
        }

                const player = allPlayers.find(p => p.id === id);
                document.getElementById('modal-title').innerText = "Edit Data Pemain";
                document.getElementById('form-id').value = player.id;
                document.getElementById('form-name').value = player.name;
                document.getElementById('form-position').value = player.position;
                document.getElementById('form-foot').value = player.foot;
                document.getElementById('form-school').value = player.school;
                document.getElementById('form-phone').value = player.phone;
                document.getElementById('form-ttl').value = player.ttl;
                document.getElementById('form-club').value = player.club;
                document.getElementById('form-domisili').value = player.domisili || 'Kab. Kediri';
                btnDelete.classList.remove('hidden');
            } else {
                document.getElementById('modal-title').innerText = "Tambah Pemain Baru";
                document.getElementById('player-form').reset();
                document.getElementById('form-id').value = '';
                document.getElementById('form-domisili').value = 'Kab. Kediri';
                btnDelete.classList.add('hidden');
            }
        }

        window.closeModal = function() {
            document.getElementById('modal-form').classList.add('hidden');
            currentEditingId = null;
        }

        window.handleFormSubmit = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save');
            btn.innerText = "Menyimpan...";
            btn.disabled = true;

            const playerData = {
                name: document.getElementById('form-name').value,
                position: document.getElementById('form-position').value,
                foot: document.getElementById('form-foot').value,
                school: document.getElementById('form-school').value,
                phone: document.getElementById('form-phone').value,
                ttl: document.getElementById('form-ttl').value,
                club: document.getElementById('form-club').value,
                domisili: document.getElementById('form-domisili').value
            };

            try {
                if (currentEditingId) {
                    await updateDoc(doc(db, "players", currentEditingId), playerData);
                } else {
                    await addDoc(collection(db, "players"), playerData);
                }
                closeModal();
                loadPlayers();
            } catch (error) {
                console.error("Error saving:", error);
                alert("Gagal menyimpan data.");
            } finally {
                btn.innerText = "Simpan";
                btn.disabled = false;
            }
        }

        window.deletePlayerFromModal = async function() {
            if (currentEditingId && confirm("Yakin ingin menghapus pemain ini dari database?")) {
                try {
                    await deleteDoc(doc(db, "players", currentEditingId));
                    closeModal();
                    loadPlayers();
                } catch (error) {
                    console.error("Error deleting:", error);
                    alert("Gagal menghapus data.");
                }
            }
        }
    </script>
</body>
</html>
