<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pemain Lolos Seleksi - Ponprov Kab Kediri 2026</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- SheetJS (xlsx) untuk Export & Import Excel -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen p-3 md:p-8 font-sans antialiased selection:bg-emerald-500 selection:text-slate-950">

    <div class="max-w-7xl mx-auto space-y-6">
        <!-- Header & Search -->
        <div class="flex flex-col md:flex-row justify-between items-stretch md:items-center gap-4 bg-slate-900 border border-slate-800 p-5 rounded-2xl shadow-xl">
            <div>
                <h1 class="text-base md:text-xl font-bold text-slate-100">Pemain Lolos Seleksi</h1>
                <p class="text-xs text-slate-400">Ponprov Kab Kediri 2026</p>
            </div>
            <div class="flex flex-wrap items-center gap-2.5 w-full md:w-auto">
                <input type="text" id="search-input" oninput="filterData()" placeholder="Cari nama atau sekolah..." class="bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs text-slate-200 focus:outline-none focus:border-emerald-500 w-full md:w-48 placeholder-slate-600">
                
                <!-- Tombol Export Excel -->
                <button onclick="exportToExcel()" class="px-3.5 py-2.5 bg-sky-600 hover:bg-sky-500 text-slate-950 font-bold rounded-xl text-xs transition shadow-md shadow-sky-900/40 shrink-0 flex items-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    <span>Export</span>
                </button>

                <!-- Tombol Import Excel -->
                <label class="px-3.5 py-2.5 bg-amber-600 hover:bg-amber-500 text-slate-950 font-bold rounded-xl text-xs transition shadow-md shadow-amber-900/40 shrink-0 flex items-center gap-1.5 cursor-pointer">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                    <span>Import</span>
                    <input type="file" id="excel-file-input" accept=".xlsx, .xls, .csv" onchange="importFromExcel(event)" class="hidden">
                </label>

                <!-- Tombol Tambah Manual -->
                <button onclick="openModal()" class="px-3.5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold rounded-xl text-xs transition shadow-md shadow-emerald-900/40 shrink-0 flex items-center justify-center gap-1.5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
                    <span>Tambah</span>
                </button>
            </div>
        </div>

        <!-- Tabel Konten -->
        <div id="table-container" class="space-y-6">
            <p class="text-center text-slate-500 text-sm py-12" id="loading-text">Menghubungkan ke Firebase...</p>
        </div>
    </div>

    <!-- Modal Form Edit / Tambah (Pop-up) -->
    <div id="modal-form" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-3 md:p-4">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-lg rounded-2xl p-5 md:p-6 space-y-4 shadow-2xl max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h3 class="font-bold text-base text-slate-100" id="modal-title">Edit Data Pemain</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-200 font-bold text-xl p-1">&times;</button>
            </div>
            <form id="player-form" onsubmit="handleFormSubmit(event)" class="space-y-3 text-xs">
                <input type="hidden" id="form-id">
                
                <div>
                    <label class="block text-slate-400 mb-1 font-medium">Nama Pemain</label>
                    <input type="text" id="form-name" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-emerald-500 text-sm">
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-slate-400 mb-1 font-medium">Posisi</label>
                        <select id="form-position" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-emerald-500">
                            <option value="GK">GK (Kiper)</option>
                            <option value="Anchor">Anchor</option>
                            <option value="Flank">Flank</option>
                            <option value="Pivot">Pivot</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1 font-medium">Strongest Foot</label>
                        <select id="form-foot" required class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-emerald-500">
                            <option value="Right">Right</option>
                            <option value="Left">Left</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-slate-400 mb-1 font-medium">Asal Sekolah</label>
                        <input type="text" id="form-school" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1 font-medium">No. HP</label>
                        <input type="text" id="form-phone" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-emerald-500 font-mono">
                    </div>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                    <div>
                        <label class="block text-slate-400 mb-1 font-medium">TTL</label>
                        <input type="text" id="form-ttl" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1 font-medium">Klub</label>
                        <input type="text" id="form-club" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-slate-400 mb-1 font-medium">Domisili</label>
                        <input type="text" id="form-domisili" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-slate-100 focus:outline-none focus:border-emerald-500" value="Kab. Kediri">
                    </div>
                </div>

                <div class="flex items-center justify-between pt-3 border-t border-slate-800">
                    <button type="button" id="btn-delete-modal" onclick="deletePlayerFromModal()" class="hidden px-3.5 py-2.5 bg-rose-950/40 border border-rose-900/60 hover:bg-rose-900/50 text-rose-300 rounded-xl font-bold flex items-center gap-1.5 transition">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        <span>Hapus Data</span>
                    </button>
                    <div class="flex gap-2 ml-auto">
                        <button type="button" onclick="closeModal()" class="px-4 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-medium">Batal</button>
                        <button type="submit" id="btn-save" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-slate-950 font-bold rounded-xl shadow-md">Simpan</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <!-- Script Firebase & Logika Aplikasi -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
        import { getFirestore, collection, getDocs, addDoc, updateDoc, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBcJlrKRDxd7pqOk_SDra89cGdvPCFtiu4",
            authDomain: "futsal-ponprov-kediri.firebaseapp.com",
            projectId: "futsal-ponprov-kediri",
            storageBucket: "futsal-ponprov-kediri.firebasestorage.app",
            messagingSenderId: "121808624921",
            appId: "1:121808624921:web:ea5597c1b9aad7fb51b988",
            measurementId: "G-229GSY523Z"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let allPlayers = [];
        let currentEditingId = null;

        window.onload = function() {
            loadPlayers();
        };

        async function loadPlayers() {
            document.getElementById('loading-text').innerText = "Memuat data dari Firebase...";
            try {
                const querySnapshot = await getDocs(collection(db, "players"));
                allPlayers = [];
                querySnapshot.forEach((docSnap) => {
                    allPlayers.push({ id: docSnap.id, ...docSnap.data() });
                });
                renderTables(allPlayers);
            } catch (error) {
                console.error("Error loading data: ", error);
                document.getElementById('loading-text').innerText = "Gagal memuat data. Periksa aturan Firebase rules.";
            }
        }

        function renderTables(data) {
            const container = document.getElementById('table-container');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = `<p class="text-center text-slate-500 text-sm py-12">Belum ada data pemain. Silakan klik tombol <b>"Import"</b> untuk unggah file Excel atau <b>"Tambah"</b> manual.</p>`;
                return;
            }

            const positions = [
                { title: "Penjaga Gawang (GK)", key: "GK", badge: "bg-emerald-950 text-emerald-400 border-emerald-900" },
                { title: "Anchor", key: "Anchor", badge: "bg-sky-950 text-sky-400 border-sky-900" },
                { title: "Flank", key: "Flank", badge: "bg-amber-950 text-amber-400 border-amber-900" },
                { title: "Pivot", key: "Pivot", badge: "bg-purple-950 text-purple-400 border-purple-900" }
            ];

            positions.forEach(pos => {
                const filtered = data.filter(p => p.position === pos.key);
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-xl";

                let rows = '';
                filtered.forEach((p, i) => {
                    rows += `
                        <tr onclick="openModal('${p.id}')" class="hover:bg-slate-800/70 transition cursor-pointer border-b border-slate-800/60 text-xs">
                            <td class="p-3.5 text-center text-slate-500 font-mono">${i + 1}</td>
                            <td class="p-3.5 font-bold text-slate-100">${p.name}</td>
                            <td class="p-3.5 text-slate-300 hidden sm:table-cell">${p.ttl || '-'}</td>
                            <td class="p-3.5 text-slate-300">${p.school || '-'}</td>
                            <td class="p-3.5 text-slate-400 font-mono hidden md:table-cell">${p.phone || '-'}</td>
                            <td class="p-3.5 text-center font-bold text-slate-300 hidden md:table-cell">${p.foot || 'Right'}</td>
                            <td class="p-3.5 text-slate-300 hidden lg:table-cell">${p.club || '-'}</td>
                            <td class="p-3.5 text-slate-300 hidden sm:table-cell">${p.domisili || '-'}</td>
                        </tr>
                    `;
                });

                card.innerHTML = `
                    <div class="bg-slate-950 px-5 py-3.5 border-b border-slate-800 flex justify-between items-center">
                        <span class="px-3 py-1 rounded-xl text-xs font-bold border ${pos.badge}">${pos.title}</span>
                        <span class="text-xs text-slate-400 font-mono">Total: ${filtered.length} Pemain</span>
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead class="bg-slate-950/40 text-slate-400 uppercase font-bold text-[10px] border-b border-slate-800">
                                <tr>
                                    <th class="p-3.5 w-10 text-center">No</th>
                                    <th class="p-3.5">Nama</th>
                                    <th class="p-3.5 hidden sm:table-cell">TTL</th>
                                    <th class="p-3.5">Asal Sekolah</th>
                                    <th class="p-3.5 hidden md:table-cell">No. HP</th>
                                    <th class="p-3.5 text-center hidden md:table-cell">Foot</th>
                                    <th class="p-3.5 hidden lg:table-cell">Klub</th>
                                    <th class="p-3.5 hidden sm:table-cell">Domisili</th>
                                </tr>
                            </thead>
                            <tbody>${rows || '<tr><td colspan="8" class="p-4 text-center text-slate-500">Tidak ada pemain.</td></tr>'}</tbody>
                        </table>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.filterData = function() {
            const query = document.getElementById('search-input').value.toLowerCase();
            const filtered = allPlayers.filter(p => p.name.toLowerCase().includes(query) || p.school.toLowerCase().includes(query) || (p.domisili && p.domisili.toLowerCase().includes(query)));
            renderTables(filtered);
        }

        // Fitur Export ke Excel
        window.exportToExcel = function() {
            if (allPlayers.length === 0) {
                alert("Tidak ada data untuk diexport!");
                return;
            }
            let dataExport = allPlayers.map((p, idx) => ({
                No: idx + 1,
                Nama: p.name,
                TTL: p.ttl || "-",
                "Asal Sekolah": p.school || "-",
                "No. HP": p.phone || "-",
                "Strongest Foot": p.foot || "Right",
                Klub: p.club || "-",
                Domisili: p.domisili || "Kab. Kediri",
                Posisi: p.position || "Flank"
            }));

            const worksheet = XLSX.utils.json_to_sheet(dataExport);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "Data Pemain Lolos");
            XLSX.writeFile(workbook, "Data_Pemain_Ponprov_Kab_Kediri.xlsx");
        };

        // Fitur Import dari Excel ke Firebase
        window.importFromExcel = function(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonData = XLSX.utils.sheet_to_json(worksheet);

                    if (jsonData.length === 0) {
                        alert("File Excel kosong atau format tidak sesuai!");
                        return;
                    }

                    if (!confirm(`Ditemukan ${jsonData.length} baris data dari Excel. Ingin mengimpornya ke Firebase?`)) {
                        event.target.value = '';
                        return;
                    }

                    document.getElementById('loading-text').innerText = "Mengimpor data ke Firebase...";

                    for (let row of jsonData) {
                        // Sesuaikan dengan nama kolom di Excel Anda
                        let playerObj = {
                            name: row["Nama"] || row["nama"] || row["NAME"] || "Tanpa Nama",
                            ttl: row["TTL"] || row["ttl"] || "-",
                            school: row["Asal Sekolah"] || row["asal sekolah"] || row["School"] || "-",
                            phone: String(row["No. HP"] || row["no hp"] || row["Phone"] || "-"),
                            foot: row["Strongest Foot"] || row["foot"] || "Right",
                            club: row["Klub"] || row["klub"] || row["Club"] || "-",
                            domisili: row["Domisili"] || row["domisili"] || "Kab. Kediri",
                            position: row["Posisi"] || row["posisi"] || row["Position"] || "Flank"
                        };
                        await addDoc(collection(db, "players"), playerObj);
                    }

                    alert("Berhasil mengimpor data dari Excel ke Firebase!");
                    event.target.value = '';
                    loadPlayers();
                } catch (error) {
                    console.error("Gagal import excel:", error);
                    alert("Terjadi kesalahan saat membaca file Excel.");
                    event.target.value = '';
                }
            };
            reader.readAsArrayBuffer(file);
        };

        window.openModal = function(id = null) {
            document.getElementById('modal-form').classList.remove('hidden');
            currentEditingId = id;
            const btnDelete = document.getElementById('btn-delete-modal');

            if (id) {
                const player = allPlayers.find(p => p.id === id);
                document.getElementById('modal-title').innerText = "Edit Data Pemain";
                document.getElementById('form-id').value = player.id;
                document.getElementById('form-name').value = player.name;
                document.getElementById('form-position').value = player.position;
                document.getElementById('form-foot').value = player.foot;
                document.getElementById('form-school').value = player.school;
                document.getElementById('form-phone').value = player.phone;
                document.getElementById('form-ttl').value = player.ttl;
                document.getElementById('form-club').value = player.club;
                document.getElementById('form-domisili').value = player.domisili || 'Kab. Kediri';
                btnDelete.classList.remove('hidden');
            } else {
                document.getElementById('modal-title').innerText = "Tambah Pemain Baru";
                document.getElementById('player-form').reset();
                document.getElementById('form-id').value = '';
                document.getElementById('form-domisili').value = 'Kab. Kediri';
                btnDelete.classList.add('hidden');
            }
        }

        window.closeModal = function() {
            document.getElementById('modal-form').classList.add('hidden');
            currentEditingId = null;
        }

        window.handleFormSubmit = async function(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-save');
            btn.innerText = "Menyimpan...";
            btn.disabled = true;

            const playerData = {
                name: document.getElementById('form-name').value,
                position: document.getElementById('form-position').value,
                foot: document.getElementById('form-foot').value,
                school: document.getElementById('form-school').value,
                phone: document.getElementById('form-phone').value,
                ttl: document.getElementById('form-ttl').value,
                club: document.getElementById('form-club').value,
                domisili: document.getElementById('form-domisili').value
            };

            try {
                if (currentEditingId) {
                    await updateDoc(doc(db, "players", currentEditingId), playerData);
                } else {
                    await addDoc(collection(db, "players"), playerData);
                }
                closeModal();
                loadPlayers();
            } catch (error) {
                console.error("Error saving:", error);
                alert("Gagal menyimpan data.");
            } finally {
                btn.innerText = "Simpan";
                btn.disabled = false;
            }
        }

        window.deletePlayerFromModal = async function() {
            if (currentEditingId && confirm("Yakin ingin menghapus pemain ini dari database?")) {
                try {
                    await deleteDoc(doc(db, "players", currentEditingId));
                    closeModal();
                    loadPlayers();
                } catch (error) {
                    console.error("Error deleting:", error);
                    alert("Gagal menghapus data.");
                }
            }
        }
    </script>
</body>
</html>
